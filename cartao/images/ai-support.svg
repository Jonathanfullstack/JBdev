  <rect x="558" y="114" width="416" height="68" rx="16" fill="#0b2337"/><text x="580" y="143" fill="#dceef8" font-family="Arial,sans-serif" font-size="15">Olá! Preciso de ajuda para escolher</text><text x="580" y="164" fill="#dceef8" font-family="Arial,sans-serif" font-size="15">a melhor solução para minha empresa.</text>
  <rect x="664" y="204" width="420" height="90" rx="16" fill="#073a65" stroke="#087dff"/><text x="686" y="234" fill="#e9f7ff" font-family="Arial,sans-serif" font-size="15">Claro, Marina! Posso analisar sua necessidade</text><text x="686" y="256" fill="#e9f7ff" font-family="Arial,sans-serif" font-size="15">e sugerir o caminho mais adequado.</text><rect x="686" y="270" width="112" height="6" rx="3" fill="#00d9ed"/>
