  <g font-family="Arial,sans-serif"><g fill="#e5f3fc" font-size="16" font-weight="700"><text x="282" y="197">Marina Costa</text><text x="282" y="309">Lucas Martins</text><text x="282" y="421">Ana Ribeiro</text><text x="282" y="533">Felipe Rocha</text></g><g fill="#6f94ad" font-size="13"><text x="282" y="221">Preciso de ajuda com...</text><text x="282" y="333">Gostaria de uma proposta...</text><text x="282" y="445">Como acesso minha conta?</text><text x="282" y="557">Obrigado pelo atendimento!</text></g></g><g fill="url(#bot)"><circle cx="257" cy="204" r="16"/><circle cx="257" cy="316" r="16"/><circle cx="257" cy="428" r="16"/><circle cx="257" cy="540" r="16"/></g>
